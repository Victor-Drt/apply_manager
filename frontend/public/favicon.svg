<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Ícone de Base: Currículo/Card de Candidatura (Azul Escuro/Royal) -->
  <path d="M6 3C4.34315 3 3 4.34315 3 6V26C3 27.6569 4.34315 29 6 29H26C27.6569 29 29 27.6569 29 26V13L21 5H6Z" fill="#1E3A8A" />
  
  <!-- Canto dobrado do documento (Feedback de papel/currículo) -->
  <path d="M21 5V11C21 12.1046 21.8954 13 23 13H29L21 5Z" fill="#3B82F6" />

  <!-- Detalhes internos: Linhas de Informação/Progresso (Azul Claro) -->
  <rect x="7" y="9" width="10" height="2" rx="1" fill="#3B82F6" />
  <rect x="7" y="14" width="12" height="2" rx="1" fill="#3B82F6" />
  <rect x="7" y="19" width="8" height="2" rx="1" fill="#3B82F6" />

  <!-- Símbolo de Progresso e Acompanhamento: Gráfico Crescente e Checkmark/Seta integrados (Verde Vibrante) -->
  <path d="M14 24.5L18.5 20L21.5 23L27.5 16.5" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Seta indicando o avanço/progresso contínuo no topo direito do gráfico -->
  <path d="M24 16.5H27.5V20" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Ponto ou Marcador de Acompanhamento no final do percurso (Lupa ou Alvo de foco) -->
  <circle cx="21" cy="24" r="3" stroke="#06B6D4" stroke-width="2.5" />
</svg>
